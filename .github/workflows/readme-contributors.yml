name: Refresh contributor grid
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: write
concurrency:
  group: readme-contributors
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - name: Refresh contributor grid
        env:
          GH_TOKEN: ${{ github.token }}
          README_PATH: readme.md
        run: |
          python3 .github/scripts/readme-contributors.py
          git add -- "$README_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh contributor grid'
          git push origin HEAD:refs/heads/main
